<div class="login-page">
  <form class="login-card ui-card" [formGroup]="loginForm" (ngSubmit)="login()">
    <a routerLink="/" class="brand f-18 mb-4">
      <img src="assets/images/app-icon.png" alt="">
      Office Colonoscopy
    </a>
    <h1 class="f-28 fw-700 mb-1">Admin login</h1>
    <p class="text-grey2 mb-4">Manage the games list.</p>

    <mat-form-field class="w-100">
      <mat-label>User name</mat-label>
      <input matInput formControlName="userName" autocomplete="username">
    </mat-form-field>
    <mat-form-field class="w-100">
      <mat-label>Password</mat-label>
      <input matInput formControlName="password" type="password" autocomplete="current-password">
    </mat-form-field>

    <div *ngIf="error" class="login-error"><i class="bi bi-exclamation-circle"></i> {{ error }}</div>

    <button class="ui-btn primary w-100 justify-content-center py-2" type="submit" [disabled]="loading">
      {{ loading ? 'Logging in…' : 'Log in' }}
    </button>
    <a routerLink="/" class="d-block text-center mt-3 text-grey2 f-14">Back to games</a>
  </form>
</div>
