<a class="game-card" [class.played]="data.link.clicked"
   [href]="data.link.link" target="_blank" rel="noopener"
   (click)="nav(data.link)" (auxclick)="$event.button === 1 ? nav(data.link) : null">
  <div class="thumb">
    <img *ngIf="!previewUrl" [src]="setGamePic(data.link)" [alt]="data.link.name" loading="lazy" width="320" height="200"
         (error)="onImageError($event)">
    <!-- Live, non-interactive snapshot of the site for games without an image -->
    <iframe *ngIf="previewUrl" class="site-preview" [src]="previewUrl" loading="lazy"
            sandbox="allow-scripts allow-same-origin" tabindex="-1" aria-hidden="true"
            referrerpolicy="no-referrer" [title]="data.link.name + ' preview'"></iframe>
  </div>
  <div class="body">
    <div class="title-row">
      <span class="name">{{ data.link.name }}</span>
      <span class="clicks" title="{{ data.link.clickCount }} plays"><i class="bi bi-hand-index"></i>{{ clicks }}</span>
    </div>
    <p class="description">{{ data.link.description }}</p>
    <div class="tags" *ngIf="data.link.subCategory?.length">
      <i *ngFor="let s of data.link.subCategory" [class]="subCategoryIcon(s)" [title]="s"></i>
    </div>
  </div>
</a>
<button *ngIf="data.link.clicked" class="played-badge" type="button"
        title="Mark as not played" (click)="unplay()">
  <i class="bi bi-check-lg"></i> played <i class="bi bi-x-lg undo"></i>
</button>
