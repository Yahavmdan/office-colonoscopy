<div class="game-wrap">
  <div *ngIf="data.isAdmin" class="admin-actions">
    <button class="ui-icon-btn" title="Edit" (click)="edit(data.link)"><i class="bi bi-pencil"></i></button>
    <button class="ui-icon-btn danger" title="Delete" (click)="delete(data.link)"><i class="bi bi-trash3"></i></button>
  </div>
  <app-game [data]="{link: data.link, isAdmin: data.isAdmin}"></app-game>
</div>
