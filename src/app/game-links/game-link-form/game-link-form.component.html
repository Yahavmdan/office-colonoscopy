<form class="p-4 d-flex flex-column" [formGroup]="gameLinkForm" (ngSubmit)="submit()">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="f-20 fw-700">{{ title }}</div>
    <i class="bi bi-x-lg pointer" (click)="cancel()"></i>
  </div>

  <mat-form-field class="w-100">
    <mat-label>Name</mat-label>
    <input matInput formControlName="name">
    <mat-error>required field</mat-error>
  </mat-form-field>

  <mat-form-field class="w-100">
    <mat-label>Description</mat-label>
    <input matInput formControlName="description">
    <mat-error>required field</mat-error>
  </mat-form-field>

  <mat-form-field class="w-100">
    <mat-label>Link</mat-label>
    <input matInput formControlName="link" placeholder="https://...">
    <a *ngIf="gameLinkForm.get('link')?.valid" matSuffix [href]="gameLinkForm.get('link')?.value" target="_blank"
       class="px-2 text-grey2" title="Open link"><i class="bi bi-box-arrow-up-right"></i></a>
    <mat-error *ngIf="gameLinkForm.get('link')?.hasError('required')">required field</mat-error>
    <mat-error *ngIf="gameLinkForm.get('link')?.hasError('pattern')">must start with http:// or https://</mat-error>
  </mat-form-field>

  <div class="d-flex gap-2">
    <mat-form-field class="w-50">
      <mat-label>Category</mat-label>
      <mat-select formControlName="category">
        <mat-option *ngFor="let category of categories" [value]="category">{{ category }}</mat-option>
      </mat-select>
      <mat-error>required field</mat-error>
    </mat-form-field>

    <mat-form-field class="w-50">
      <mat-label>Sub categories</mat-label>
      <mat-select formControlName="subCategory" multiple>
        <mat-option *ngFor="let subCategory of subCategories" [value]="subCategory">{{ subCategory }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="d-flex gap-3 align-items-start">
    <mat-form-field class="flex-grow-1">
      <mat-label>Image file</mat-label>
      <input matInput formControlName="image" placeholder="worldle.png">
      <mat-hint>file name in assets/images/game-pic</mat-hint>
    </mat-form-field>
    <img [src]="imageSrc" alt="preview" width="96" height="60" class="border object-fit-cover"
         (error)="onImageError($event)">
  </div>

  <div class="d-flex gap-2 mt-4 justify-content-end flex-wrap">
    <span *ngIf="addedCount" class="me-auto align-self-center text-grey3">{{ addedCount }} added</span>
    <button class="ui-btn ghost" type="button" (click)="cancel()">Cancel</button>
    <button *ngIf="!editMode" class="ui-btn" type="button" [disabled]="saving" (click)="submit(true)">
      Save &amp; add another
    </button>
    <button class="ui-btn primary" type="submit" [disabled]="saving">
      {{ editMode ? 'Save changes' : 'Add game' }}
    </button>
  </div>
</form>
